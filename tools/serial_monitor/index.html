<!doctype html><meta charset="utf-8"><title>3x3串口监视器</title><style>body{font-family:system-ui}button{margin:4px}.grid{display:grid;grid-template-columns:repeat(3,140px);gap:8px}.cell{border:1px solid #888;padding:12px;min-height:70px}</style><button id="connect">连接串口</button><button id="clear">清空</button><pre id="log"></pre><div class="grid" id="grid"></div><script>const log=document.querySelector('#log'),grid=document.querySelector('#grid');let cells={};for(let i=0;i<9;i++){let d=document.createElement('div');d.className='cell';d.id='c'+i;d.textContent='A'+(i+1)+'\nEMPTY';grid.append(d)}document.querySelector('#clear').onclick=()=>log.textContent='';document.querySelector('#connect').onclick=async()=>{if(!('serial' in navigator)){alert('浏览器不支持 Web Serial');return}let port=await navigator.serial.requestPort();await port.open({baudRate:115200});let reader=port.readable.pipeThrough(new TextDecoderStream()).getReader(),buf='';while(true){let {value,done}=await reader.read();if(done)break;buf+=value;let lines=buf.split('\n');buf=lines.pop();for(const line of lines){log.textContent+=line+'\n';try{let j=JSON.parse(line);if(j.channel){let n=parseInt(j.channel.replace(/[^0-9]/g,''))-1;document.querySelector('#c'+n).textContent=j.channel+'\n'+(j.uid||'EMPTY')+'\n'+j.status}}catch(e){}}}};</script>
